const n='weight enclosure calendar-clock category repeat-thin person-thin bell-thin book-thin seal-proof task-schedule task-attachment task-tag alarm list-view timeline-view panel-view table-view account-circle person-edit notifications-active medical-id'.split(' ');
document.write(a.map(s=>`<div><span class="app-icon app-icon--tint i-${s}"></span>${s}</div>`).join('')+n.map(s=>`<div><span class="app-icon app-icon--tint" style="--icon:url(../../../app/icons/new/${s}.svg)"></span>new/${s}</div>`).join(''));
</script>
